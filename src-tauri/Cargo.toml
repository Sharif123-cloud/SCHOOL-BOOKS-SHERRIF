[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
tauri = { version = "1.5", features = [ "api-all" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = "1.5"
