[package]
name = "student-reader"
version = "1.0.0"
edition = "2021"

[lib]
name = "student_reader_lib"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "student-reader"
path = "src/main.rs"

[dependencies]
tauri = { version = "1.5", features = ["api-all", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.30", features = ["bundled"] }
chrono = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
epub = "0.6"
lopdf = "0.31"
walkdir = "2"

[build-dependencies]
tauri-build = "1"
