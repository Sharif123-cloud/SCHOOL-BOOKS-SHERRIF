[package]
name = "student-reader"
version = "1.0.0"
edition = "2021"

[lib]
name = "student_reader_lib"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "student-reader"
path = "src/main.rs"

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.28", features = ["bundled"] }
chrono = "0.4.19"
argon2 = "0.4"
aes-gcm = "0.9"
rand = "0.8"
base64 = "0.13"
epub = "0.6"
lopdf = "0.28"
walkdir = "2"

# Force old time crate to avoid conflicts
time = "=0.1.43"

[build-dependencies]
tauri-build = "1.5"
